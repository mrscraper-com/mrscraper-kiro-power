name: Validate Kiro power

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  AJV_CLI_VERSION: 5.0.0
  # agentskills/agentskills main on 2026-08-09; skills-ref is the Agent Skills reference validator.
  SKILLS_REF: git+https://github.com/agentskills/agentskills@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Structural checks
        run: python3 .github/scripts/check_power.py

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Validate plugin.json and mcp.json against the Agent Plugins 1.0.0 schemas
        run: |
          mkdir -p "$RUNNER_TEMP/schemas"
          for schema in plugin mcp; do
            curl -fsSL -o "$RUNNER_TEMP/schemas/$schema.schema.json" \
              "https://agent-plugins.org/schemas/1.0.0/$schema.schema.json"
            npx --yes "ajv-cli@${AJV_CLI_VERSION}" validate --spec=draft2020 \
              -s "$RUNNER_TEMP/schemas/$schema.schema.json" -d "$schema.json"
          done

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Validate skills with skills-ref
        run: |
          for skill in skills/*/; do
            uvx --from "$SKILLS_REF" skills-ref validate "$skill"
          done
